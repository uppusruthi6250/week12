apiVersion: apps/v1
kind: Deployment
metadata:
  name: week12-registration-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: week12-registration
  template:
    metadata:
      labels:
        app: week12-registration
    spec:
      containers:
        - name: week12-registration
          image: uppusruthi6250/sample:seleniumtestimage
          imagePullPolicy: Always
          ports:
            - containerPort: 5000